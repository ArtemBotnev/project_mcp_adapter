allowed_roots:
  - /path/to/your/projects

# Support tickets/users are owned by the MCP server.
# Relative paths are resolved from this config file directory.
support_data_path: support_data
support_users_file: support/users.json
support_tickets_file: support/tickets.json
support_histories_file: support/histories.json
support_rag_index_dir: rag
support_agent_config_file: support_agent.yaml

blocked_names:
  - .env
  - .env.local
  - .env.production
  - id_rsa
  - id_ed25519

blocked_suffixes:
  - .local.yaml
  - .local.yml
  - .pem
  - .key
  - .p12
  - .sqlite
  - .db

blocked_dirs:
  - .git
  - .venv
  - venv
  - node_modules
  - __pycache__
  - .idea
  - .vscode
  - .gradle
  - dist
  - build
  - target

max_file_size_bytes: 1000000
max_list_files: 5000
max_diff_bytes: 200000

# Workspace assistant can inspect files and return answers to the client.
# It does not write reports unless report mode is explicitly requested, and
# it does not modify project files unless apply mode is explicitly implemented/enabled.
workspace_enabled: true
workspace_reports_dir: workspace_reports
workspace_allow_apply: false
workspace_max_files_read: 30
workspace_max_write_bytes: 200000
