[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-project-mcp"
version = "0.1.0"
description = "Local project context and workspace MCP server"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "mcp>=1.8.0",
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
local-project-mcp = "local_project_mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
